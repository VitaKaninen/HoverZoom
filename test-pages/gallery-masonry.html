<!doctype html>
<meta charset="utf-8">
<title>Gallery mode — masonry results</title>
<!--
  Gallery mode on a column ("masonry") results page: 5 columns, first row all portrait, then about
  1 in 10 landscape, each scaled to the column width, so rows never line up. Every result links to
  gallery-mixed.html (20 pictures, half portrait) with its own ?g=N, so each counts as its own gallery.
  Adds its own path to the site list (previews off) and localhost to the gallery list.
-->
<style>
  body { font: 14px system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 70px; }
  .cols { display: flex; gap: 14px; align-items: flex-start; }
  .col { width: 190px; display: flex; flex-direction: column; gap: 14px; }
  .col img { width: 100%; height: auto; display: block; }
  .result span { font-size: 12px; color: #6c7086; }
</style>
<div class="cols" id="cols"></div>
<script>
  (function () {
    var key = 'hoverZoomSettings', path = 'localhost/test-pages/gallery-masonry.html', s = {};
    try { s = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
    s.siteList = s.siteList || [];
    if (s.siteList.indexOf(path) < 0) s.siteList.push(path);
    s.gallerySites = s.gallerySites || [];
    if (s.gallerySites.indexOf('localhost') < 0) s.gallerySites.push('localhost');
    localStorage.setItem(key, JSON.stringify(s));

    var cols = [], hts = [], i, n = 80, wrap = document.getElementById('cols');
    for (i = 0; i < 5; i++) {
      cols[i] = document.createElement('div');
      cols[i].className = 'col';
      wrap.appendChild(cols[i]);
      hts[i] = 0;
    }
    for (i = 1; i <= n; i++) {
      var land = i > 5 && (i * 7) % 10 === 3;   // about 1 in 10, none in the first row
      var c = hts.indexOf(Math.min.apply(null, hts));
      var d = document.createElement('div'), a = document.createElement('a'), img = document.createElement('img'), t = document.createElement('span');
      d.className = 'result';
      a.href = 'gallery-mixed.html?g=' + i;
      img.src = '/test-images/' + (land ? 'photo-200x150.jpg' : 'portrait-200x300.jpg') + '?s' + i;
      img.width = 200; img.height = land ? 150 : 300;
      t.textContent = 'gallery ' + i + (land ? ' (landscape)' : '');
      a.appendChild(img);
      d.appendChild(a);
      d.appendChild(t);
      cols[c].appendChild(d);
      hts[c] += land ? 160 : 300;
    }
  })();
  var GM_getValue = function (key, dflt) {
    var v = localStorage.getItem(key);
    return v === null ? dflt : v;
  };
  var GM_setValue = function (key, val) { localStorage.setItem(key, val); };
  var GM_addValueChangeListener = function (key, fn) {
    window.addEventListener('storage', function (e) {
      if (e.key === key) fn(key, e.oldValue, e.newValue, true);
    });
  };
  var GM_registerMenuCommand = function () { return 'x'; };
  var GM_unregisterMenuCommand = function () {};
</script>
<script src="../Hover-Zoom.user.js"></script>
