<!doctype html>
<meta charset="utf-8">
<title>Gallery built by script</title>
<!-- Its 25 pictures are added by a script after load, so the plain HTML holds only the logo. Gallery mode must read it through the hidden frame. -->
<style>body{margin:0;background:#1e1e2e} .grid img{width:200px;height:150px;margin:6px}</style>
<header><div class="logo-section"><a href="/"><img src="/test-images/icon.png" width="32" height="32"></a></div></header>
<div class="grid" id="grid"></div>
<script>
  setTimeout(function () {
    var g = document.getElementById('grid');
    for (var i = 1; i <= 25; i++) {
      var d = document.createElement('div'); d.className = 'item';
      var a = document.createElement('a'); a.href = '#p' + i;
      var im = document.createElement('img'); im.src = '/test-images/photo-200x150.jpg?js' + i;
      im.setAttribute('srcset', '/test-images/photo-200x150.jpg?js' + i + ' 200w, /test-images/photo-420x315.jpg?js' + i + ' 420w');
      a.appendChild(im); d.appendChild(a); g.appendChild(d);
    }
  }, 300);
</script>
<script>
  var GM_getValue = function (key, dflt) {
    var v = localStorage.getItem(key);
    return v === null ? dflt : v;
  };
  var GM_setValue = function (key, val) { localStorage.setItem(key, val); };
  var GM_addValueChangeListener = function (key, fn) {
    window.addEventListener('storage', function (e) {
      if (e.key === key) fn(key, e.oldValue, e.newValue, true);
    });
  };
  var GM_registerMenuCommand = function () { return 'x'; };
  var GM_unregisterMenuCommand = function () {};
</script>
<script src="../Hover-Zoom.user.js"></script>
