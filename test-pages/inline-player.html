<!doctype html>
<meta charset="utf-8">
<title>A player that arrives under the pointer</title>
<!--
  YouTube's subscriptions grid, reduced. See E61. Two shapes, one file:

  Default — one <video> sits dormant on the page (display:none), the way YouTube's inline preview
  player does between hovers. Every card links to /watch?, so under videoMode 'all' every card is
  REFUSED up front (dormantPlayer): nothing opens, on any card, ever. Card 1 moves the dormant
  player over its thumbnail 250 ms in, as YouTube does; the refusal has already happened.

  ?nodormant — no video on the page at rest. Card 1 CREATES a player over its thumbnail 250 ms in.
    1 · the preview opens (the resolve is faster than the cover here), then is withdrawn by
        geometry on the next pointer move — or never opens, if the player beat the resolve.
    2 · a plain <div> overlay: the preview opens and STAYS — a cover that is not a player makes it
        a covered hover.
    3 · control, never covered: opens and stays.

  The page sets videoMode 'all' and debug in localStorage on load, for the page copy of the script.
-->
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; max-width: 60em; }
  .grid { display: flex; gap: 24px; }
  .card { position: relative; width: 200px; }
  .card img { display: block; width: 200px; height: 150px; }
  .card .cover { position: absolute; left: 0; top: 0; width: 200px; height: 150px; }
  .card .cover video { width: 200px; height: 150px; background: #000; }
  .card .cover.plain { background: rgba(0,0,0,.4); }
  .card p { margin: 6px 0 0; color: #555; }
  #inline { display: none; }
</style>

<h1>A player that arrives under the pointer</h1>
<p id="expect"></p>

<div class="grid">
  <div class="card" data-cover="player">
    <a href="/watch?v=one"><img src="/test-images/photo-200x150.jpg" alt=""></a>
    <p>1 · player after 250 ms</p>
  </div>
  <div class="card" data-cover="plain">
    <a href="/watch?v=two"><img src="/test-images/photo-200x150.jpg?b" alt=""></a>
    <p>2 · plain overlay after 250 ms</p>
  </div>
  <div class="card">
    <a href="/watch?v=three"><img src="/test-images/photo-200x150.jpg?c" alt=""></a>
    <p>3 · control, never covered</p>
  </div>
</div>

<script>
  var dormant = location.search.indexOf('nodormant') < 0;
  document.getElementById('expect').textContent = dormant
    ? 'A dormant player is on this page: nothing must open on any card.'
    : 'No player at rest. Card 1: opens, then withdrawn when the player lands. Card 2: opens and stays under the grey overlay. Card 3: opens.';

  var inline = null;
  if (dormant) {
    inline = document.createElement('video');
    inline.id = 'inline';
    inline.muted = true;
    inline.src = '/test-images/clip-2s.mp4';
    document.body.appendChild(inline);
  }

  document.querySelectorAll('.card[data-cover]').forEach(function (card) {
    var timer = 0, cv = null, made = null;
    card.addEventListener('mouseenter', function () {
      timer = setTimeout(function () {
        cv = document.createElement('div');
        cv.className = 'cover';
        if (card.dataset.cover === 'player') {
          var v = inline;
          if (!v) { v = made = document.createElement('video'); v.muted = true; v.src = '/test-images/clip-2s.mp4'; }
          cv.appendChild(v);
          v.style.display = 'block';
          v.play().catch(function () {});
        } else {
          cv.classList.add('plain');
        }
        card.appendChild(cv);
      }, 250);
    });
    card.addEventListener('mouseleave', function () {
      clearTimeout(timer);
      if (!cv) return;
      if (inline && inline.parentNode === cv) { inline.pause(); inline.style.display = ''; document.body.appendChild(inline); }
      if (made) { made.pause(); made = null; }
      cv.remove(); cv = null;
    });
  });

  var s = {};
  try { s = JSON.parse(localStorage.getItem('hoverZoomSettings') || '{}'); } catch (e) {}
  s.videoMode = 'all';
  s.debug = true;
  localStorage.setItem('hoverZoomSettings', JSON.stringify(s));

  var GM_getValue = function (key, dflt) {
    var v = localStorage.getItem(key);
    return v === null ? dflt : v;
  };
  var GM_setValue = function (key, val) { localStorage.setItem(key, val); };
  var GM_addValueChangeListener = function (key, fn) {
    window.addEventListener('storage', function (e) {
      if (e.key === key) fn(key, e.oldValue, e.newValue, true);
    });
  };
  var GM_registerMenuCommand = function () { return 'x'; };
  var GM_unregisterMenuCommand = function () {};
</script>
<script src="../Hover-Zoom.user.js"></script>
