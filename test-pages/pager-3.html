<title>Paged gallery — page 3 of 4</title>
<!--
  The fixture for TOUR.md §10, in FOUR STATIC FILES rather than one script-built page.
  That is not a style choice: the tour reaches page 2 with fetch() + DOMParser, which does
  not run scripts, so a fixture that builds its own markup would be fetched empty and prove
  nothing. Real pages serve their markup; so does this.

  Each page offers its "next" by a DIFFERENT rung of nextPageIn(), so one walk exercises all
  three:

    pager-1  <a rel="next">              the declared rung
    pager-2  a numbered pager, 1 2 3 4   the number-after-this-one rung
    pager-3  "Older posts →"              the forward-word rung
    pager-4  nothing forward at all      exhausted; the tour ends there

  Page 3 also carries the decoys the detector must refuse: "Newer posts" (backward), "Top"
  and "Best" (sort controls, not direction), and an off-site "next".

  Every tile is a distinct ?n= URL, and every href here is RELATIVE on purpose: resolving a
  harvested page's links against the page you are standing on instead of the page they came
  from gives the wrong URL every time, which is what `__hzBase` exists to prevent.

  The 12×12 logo is under minDisplayed (16) by its own attributes, which is the only size gate
  a fetched page can offer: it has no layout, so nothing can be measured. It must never enter
  the tour, on page 1 by the ordinary gate and on pages 2-4 by harvestFrom().
-->
