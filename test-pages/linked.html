<!doctype html>
<meta charset="utf-8">
<title>Linked-page areas</title>
<!--
  E15, learned per area. Each .tile links to a same-origin page that holds no copy of its picture,
  so every fetch comes back empty. Tiles 1–3 teach linkAreas; from tile 4 on the fetch is skipped
  (the debug log says "linked page skipped"), bar a 10 % recheck. Clear localStorage to start over.
-->
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; background: #1e1e2e; color: #cdd6f4; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; }
  .tile img { display: block; width: 200px; height: 150px; }
</style>

<div class="row">
  <div class="tile"><a href="/test-pages/avatars.html?l=1"><img src="/test-images/photo-200x150.jpg?l1" alt=""></a>1</div>
  <div class="tile"><a href="/test-pages/avatars.html?l=2"><img src="/test-images/photo-200x150.jpg?l2" alt=""></a>2</div>
  <div class="tile"><a href="/test-pages/avatars.html?l=3"><img src="/test-images/photo-200x150.jpg?l3" alt=""></a>3</div>
  <div class="tile"><a href="/test-pages/avatars.html?l=4"><img src="/test-images/photo-200x150.jpg?l4" alt=""></a>4 — fetch skipped once learned</div>
  <div class="tile"><a href="/test-pages/avatars.html?l=5"><img src="/test-images/photo-200x150.jpg?l5" alt=""></a>5</div>
</div>

<script>
  var GM_getValue = function (key, dflt) {
    var v = localStorage.getItem(key);
    return v === null ? dflt : v;
  };
  var GM_setValue = function (key, val) { localStorage.setItem(key, val); };
  var GM_addValueChangeListener = function (key, fn) {
    window.addEventListener('storage', function (e) {
      if (e.key === key) fn(key, e.oldValue, e.newValue, true);
    });
  };
  var GM_registerMenuCommand = function () { return 'x'; };
  var GM_unregisterMenuCommand = function () {};
</script>
<script src="../Hover-Zoom.user.js"></script>
