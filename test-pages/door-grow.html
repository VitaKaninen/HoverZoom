<!doctype html>
<meta charset="utf-8">
<title>Gallery that grows on scroll</title>
<!-- 150 pictures, mounted 10 at a time: 10 after load, then 10 more each time the bottom comes near. The plain HTML holds none, so the hidden frame reads it, and only reading on (scrolling) finds the rest. -->
<style>body{margin:0;background:#1e1e2e} .grid img{width:200px;height:150px;margin:6px}</style>
<div class="grid" id="grid"></div>
<div id="end" style="height:10px"></div>
<script>
  var made = 0;
  function more() {
    var g = document.getElementById('grid');
    for (var i = 0; i < 10 && made < 150; i++) {
      made++;
      var d = document.createElement('div'); d.className = 'tile';
      var im = document.createElement('img'); im.src = '/many/grow-' + made + '.jpg';
      d.appendChild(im); g.appendChild(d);
    }
  }
  setTimeout(more, 300);
  window.addEventListener('scroll', function () {
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 300) setTimeout(more, 200);
  });
</script>
<script>
  var GM_getValue = function (key, dflt) {
    var v = localStorage.getItem(key);
    return v === null ? dflt : v;
  };
  var GM_setValue = function (key, val) { localStorage.setItem(key, val); };
  var GM_addValueChangeListener = function () {};
  var GM_registerMenuCommand = function () { return 'x'; };
  var GM_unregisterMenuCommand = function () {};
</script>
<script src="../Hover-Zoom.user.js"></script>
